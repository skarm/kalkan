name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  KCSDK_REPOSITORY: skarm/kcsdk

jobs:
  test:
    name: Go tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Benchmark smoke test
        run: go test -run=^$ -bench=. -benchtime=1x ./...

  vet:
    name: Go vet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

  race:
    name: Go race tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Race tests
        run: go test -race ./...

  fuzz:
    name: Go fuzz tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz
        run: |
          go test -run=^$ -fuzz=^FuzzValidateXMLSOAPBinding$ -fuzztime=5s .
          go test -run=^$ -fuzz=^FuzzValidateXMLStructure$ -fuzztime=5s .
          go test -run=^$ -fuzz=^FuzzNormalizeNativeHTTPURL$ -fuzztime=5s .
          go test -run=^$ -fuzz=^FuzzZIPOutputPlan$ -fuzztime=5s .
          go test -run=^$ -fuzz=^FuzzValidateZIPPath$ -fuzztime=5s .
          go test -run=^$ -fuzz=^FuzzCertificateValidationInput$ -fuzztime=5s .
          go test -run=^$ -fuzz=^FuzzValidateBytesSize$ -fuzztime=5s .
          go test -run=^$ -fuzz=^FuzzOutputCapacityBounds$ -fuzztime=5s ./ckalkan
          go test -run=^$ -fuzz=^FuzzReadMessage$ -fuzztime=5s ./isolated

      - name: Upload fuzz reproducers
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-reproducers
          path: |
            testdata/fuzz/**
            ckalkan/testdata/fuzz/**
            isolated/testdata/fuzz/**
          if-no-files-found: ignore

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --config .golangci.yml ./...

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck -show verbose ./...

  linux:
    name: Linux KalkanCrypto SDK
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate SDK token
        shell: bash
        env:
          KCSDK_TOKEN: ${{ secrets.KCSDK_TOKEN }}
        run: |
          if [ -z "${KCSDK_TOKEN}" ]; then
            echo "::error::KCSDK_TOKEN secret is required to checkout ${KCSDK_REPOSITORY}"
            exit 1
          fi

      - name: Checkout KalkanCrypt SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ env.KCSDK_REPOSITORY }}
          token: ${{ secrets.KCSDK_TOKEN }}
          path: .local/kcsdk
          lfs: true
          persist-credentials: false

      - name: Prepare Linux native libraries
        shell: bash
        run: |
          set -euo pipefail

          sdk_dir=".local/kcsdk/linux"
          target_dir=".local/kalkancrypt/lib/linux"

          test -f "${sdk_dir}/libkalkancryptwr-64.so"
          test -f "${sdk_dir}/libkalkancryptwr-64.so.2.0.13"

          mkdir -p "${target_dir}"
          cp -a \
            "${sdk_dir}/libkalkancryptwr-64.so" \
            "${sdk_dir}/libkalkancryptwr-64.so.2.0.13" \
            "${target_dir}/"

          if grep -q "git-lfs.github.com/spec" "${target_dir}/libkalkancryptwr-64.so.2.0.13"; then
            echo "::error::KalkanCrypt Linux library was checked out as a Git LFS pointer"
            exit 1
          fi

      - name: Docker test
        run: make docker-test

  java:
    name: Java KalkanCrypt SDK (${{ matrix.os }}, JDK ${{ matrix.java }})
    runs-on: ${{ matrix.os }}
    needs: test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        java: ['17', '26']
    env:
      KALKANCRYPT_JAVA_PROVIDER: ${{ github.workspace }}/.local/kcsdk/java/knca_provider_jce_kalkan-0.7.5.jar
      KALKANCRYPT_JAVA_XML_LIBRARIES: ${{ github.workspace }}/.local/kcsdk/java/kalkancrypt-xmldsig-0.5.jar:${{ github.workspace }}/.local/kcsdk/java/xmlsec-3.0.6.jar:${{ github.workspace }}/.local/kcsdk/java/slf4j-api-2.0.9.jar
      KALKANCRYPT_SDK_ASSETS: ${{ github.workspace }}/testdata

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate SDK token
        shell: bash
        env:
          KCSDK_TOKEN: ${{ secrets.KCSDK_TOKEN }}
        run: |
          if [ -z "${KCSDK_TOKEN}" ]; then
            echo "::error::KCSDK_TOKEN secret is required to checkout ${KCSDK_REPOSITORY}"
            exit 1
          fi

      - name: Checkout KalkanCrypt SDK
        uses: actions/checkout@v7
        with:
          repository: ${{ env.KCSDK_REPOSITORY }}
          token: ${{ secrets.KCSDK_TOKEN }}
          path: .local/kcsdk
          lfs: true
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set Java executable
        shell: bash
        run: echo "KALKANCRYPT_JAVA_EXECUTABLE=${JAVA_HOME}/bin/java" >> "${GITHUB_ENV}"

      - name: Validate Java SDK JARs
        shell: bash
        run: |
          set -euo pipefail
          IFS=: read -r -a xml_jars <<< "${KALKANCRYPT_JAVA_XML_LIBRARIES}"
          for jar in "${KALKANCRYPT_JAVA_PROVIDER}" "${xml_jars[@]}"; do
            if [ ! -f "${jar}" ] || [ ! -s "${jar}" ]; then
              echo "::error::KalkanCrypt Java SDK JAR is missing or empty: ${jar}"
              exit 1
            fi
            if grep -aqF "git-lfs.github.com/spec" "${jar}"; then
              echo "::error::KalkanCrypt Java SDK JAR was checked out as a Git LFS pointer: ${jar}"
              exit 1
            fi
          done

      - name: Java SDK integration tests including XML and WS-Security
        run: go test -count=1 ./...

      - name: Java SDK race tests
        if: matrix.os == 'ubuntu-latest' && matrix.java == '26'
        run: go test -race -count=1 ./...

  windows:
    name: Windows Go tests
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        shell: pwsh
        run: go test ./...

  required:
    name: required
    runs-on: ubuntu-latest
    needs:
      - test
      - vet
      - race
      - fuzz
      - lint
      - vulncheck
      - linux
      - java
      - windows
    if: ${{ always() }}

    steps:
      - name: Check required jobs
        shell: bash
        run: |
          set -euo pipefail

          test_result="${{ needs.test.result }}"
          vet_result="${{ needs.vet.result }}"
          race_result="${{ needs.race.result }}"
          fuzz_result="${{ needs.fuzz.result }}"
          lint_result="${{ needs.lint.result }}"
          vulncheck_result="${{ needs.vulncheck.result }}"
          linux_result="${{ needs.linux.result }}"
          java_result="${{ needs.java.result }}"
          windows_result="${{ needs.windows.result }}"

          echo "Go tests: ${test_result}"
          echo "Go vet: ${vet_result}"
          echo "Go race tests: ${race_result}"
          echo "Go fuzz tests: ${fuzz_result}"
          echo "golangci-lint: ${lint_result}"
          echo "govulncheck: ${vulncheck_result}"
          echo "Linux KalkanCrypto SDK: ${linux_result}"
          echo "Java KalkanCrypt SDK: ${java_result}"
          echo "Windows Go tests: ${windows_result}"

          if [[ "${test_result}" != "success" ]]; then
            echo "::error::Go tests failed: ${test_result}"
            exit 1
          fi

          if [[ "${vet_result}" != "success" ]]; then
            echo "::error::Go vet failed: ${vet_result}"
            exit 1
          fi

          if [[ "${race_result}" != "success" ]]; then
            echo "::error::Go race tests failed: ${race_result}"
            exit 1
          fi

          if [[ "${fuzz_result}" != "success" ]]; then
            echo "::error::Go fuzz tests failed: ${fuzz_result}"
            exit 1
          fi

          if [[ "${lint_result}" != "success" ]]; then
            echo "::error::golangci-lint failed: ${lint_result}"
            exit 1
          fi

          if [[ "${vulncheck_result}" != "success" ]]; then
            echo "::error::govulncheck failed: ${vulncheck_result}"
            exit 1
          fi

          if [[ "${windows_result}" != "success" ]]; then
            echo "::error::Windows Go tests failed: ${windows_result}"
            exit 1
          fi

          is_fork_pr="${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}"

          if [[ "${is_fork_pr}" == "true" ]]; then
            echo "Fork PR detected: private SDK checks may be skipped because secrets are unavailable."

            if [[ "${linux_result}" != "success" && "${linux_result}" != "skipped" ]]; then
              echo "::error::Linux KalkanCrypto SDK failed: ${linux_result}"
              exit 1
            fi

            if [[ "${java_result}" != "success" && "${java_result}" != "skipped" ]]; then
              echo "::error::Java KalkanCrypt SDK failed: ${java_result}"
              exit 1
            fi

            exit 0
          fi

          if [[ "${linux_result}" != "success" ]]; then
            echo "::error::Linux KalkanCrypto SDK failed: ${linux_result}"
            exit 1
          fi

          if [[ "${java_result}" != "success" ]]; then
            echo "::error::Java KalkanCrypt SDK failed: ${java_result}"
            exit 1
          fi
